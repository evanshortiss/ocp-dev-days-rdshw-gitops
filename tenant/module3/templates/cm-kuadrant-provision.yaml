kind: ConfigMap
metadata:
  name: {{ include "user-workload.name" . }}-kuadrant-provision
  annotations:
    argocd.argoproj.io/sync-wave: "0"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Kuadrant provisioning for {{ .Values.tenant.username }}
      hosts: localhost
      gather_facts: false
      vars:
        tenant_username: {{ .Values.tenant.username }}
        vault_namespace: {{ .Values.vault.namespace }}
        vault_pod: {{ .Values.vault.name }}-0
      tasks:
        - name: Generate Silver API key
          ansible.builtin.set_fact:
            silver_api_key: "{{ '{{' }} lookup('password', '/dev/null chars=ascii_letters,digits length=32') {{ '}}' }}"

        - name: Generate Gold API key
          ansible.builtin.set_fact:
            gold_api_key: "{{ '{{' }} lookup('password', '/dev/null chars=ascii_letters,digits length=32') {{ '}}' }}"

        - name: Write credentials to Vault
          kubernetes.core.k8s_exec:
            namespace: "{{ '{{' }} vault_namespace {{ '}}' }}"
            pod: "{{ '{{' }} vault_pod {{ '}}' }}"
            command: >
              vault kv put kv/secrets/tenants/{{ '{{' }} tenant_username {{ '}}' }}/kuadrant
              silver_api_key="{{ '{{' }} silver_api_key {{ '}}' }}"
              gold_api_key="{{ '{{' }} gold_api_key {{ '}}' }}"
