apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-credentials
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  data:
    # S3 credentials (shared)
    - secretKey: s3AccessKey
      remoteRef:
        key: secrets/s3/noobaa
        property: accessKey
    - secretKey: s3SecretKey
      remoteRef:
        key: secrets/s3/noobaa
        property: secretKey
    - secretKey: s3Endpoint
      remoteRef:
        key: secrets/s3/noobaa
        property: endpoint

    # Database credentials (per-tenant)
    - secretKey: dbUsername
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/database
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/database
        property: password
    - secretKey: dbHost
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/database
        property: host
    - secretKey: dbPort
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/database
        property: port
    - secretKey: dbDatabase
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/database
        property: database
    - secretKey: dbSchema
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/database
        property: schema

    # Matrix credentials (per-tenant)
    - secretKey: matrixToken
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/matrix
        property: token
    - secretKey: matrixRoom
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/matrix
        property: room

    # RocketChat credentials (per-tenant)
    - secretKey: rocketchatUserId
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/rocketchat
        property: userId
    - secretKey: rocketchatToken
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/rocketchat
        property: token
    - secretKey: rocketchatChannel
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/rocketchat
        property: channel

    # Helpdesk credentials (per-tenant)
    - secretKey: helpdeskUsername
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/helpdesk
        property: username
    - secretKey: helpdeskPassword
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/helpdesk
        property: password
    - secretKey: helpdeskGroupId
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/helpdesk
        property: groupId
    - secretKey: helpdeskTypeIdIssue
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/helpdesk
        property: typeIdIssue
    - secretKey: helpdeskPriorityIdNormal
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/helpdesk
        property: priorityIdNormal

    # MaaS credentials (shared, already in Vault)
    - secretKey: maasApiKey
      remoteRef:
        key: secrets/litellm/credentials
        property: api_key
    - secretKey: maasBaseUrl
      remoteRef:
        key: secrets/litellm/credentials
        property: base_url

    # Kuadrant API keys (per-tenant)
    - secretKey: kuadrantSilverApiKey
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/kuadrant
        property: silver_api_key
    - secretKey: kuadrantGoldApiKey
      remoteRef:
        key: secrets/tenants/{{ .Values.tenant.username }}/kuadrant
        property: gold_api_key

  target:
    name: lab-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Original JSON format for backward compatibility
        database.json: |
          {
            "username": "{{ "{{ .dbUsername }}" }}",
            "password": "{{ "{{ .dbPassword }}" }}",
            "host": "{{ "{{ .dbHost }}" }}",
            "port": "{{ "{{ .dbPort }}" }}",
            "database": "{{ "{{ .dbDatabase }}" }}",
            "schema": "{{ "{{ .dbSchema }}" }}"
          }
        s3.json: |
          {
            "accessKey": "{{ "{{ .s3AccessKey }}" }}",
            "secretKey": "{{ "{{ .s3SecretKey }}" }}",
            "endpoint": "{{ "{{ .s3Endpoint }}" }}",
            "bucket": "{{ .Values.tenant.username }}"
          }
        matrix.json: |
          {
            "token": "{{ "{{ .matrixToken }}" }}",
            "room": "{{ "{{ .matrixRoom }}" }}"
          }
        rocketchat.json: |
          {
            "userId": "{{ "{{ .rocketchatUserId }}" }}",
            "token": "{{ "{{ .rocketchatToken }}" }}",
            "channel": "{{ "{{ .rocketchatChannel }}" }}"
          }
        helpdesk.json: |
          {
            "username": "{{ "{{ .helpdeskUsername }}" }}",
            "password": "{{ "{{ .helpdeskPassword }}" }}",
            "groupId": "{{ "{{ .helpdeskGroupId }}" }}",
            "typeIdIssue": "{{ "{{ .helpdeskTypeIdIssue }}" }}",
            "priorityIdNormal": "{{ "{{ .helpdeskPriorityIdNormal }}" }}"
          }
        openshift.json: |
          {
            "password": "{{ .Values.tenant.password }}"
          }
