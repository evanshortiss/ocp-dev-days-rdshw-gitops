kind: ConfigMap
metadata:
  name: {{ include "user-workload.name" . }}-rocketchat-provision
  annotations:
    argocd.argoproj.io/sync-wave: "0"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: RocketChat provisioning for {{ .Values.tenant.username }}
      hosts: localhost
      gather_facts: false
      vars:
        tenant_username: {{ .Values.tenant.username }}
        tenant_password: {{ .Values.tenant.password }}
        vault_namespace: {{ .Values.vault.namespace }}
        vault_pod: {{ .Values.vault.name }}-0
        rc_url: "http://rocketchat.{{ .Values.rocketchat.namespace }}.svc.cluster.local:3000"
        rc_admin_user: {{ .Values.rocketchat.admin.username | quote }}
        rc_admin_pass: {{ .Values.rocketchat.admin.password | quote }}
        room_name: {{ include "user-workload.roomname" . | quote }}
        ai_channel: {{ include "user-workload.ai-support-channel" . | quote }}
        user_namespace: {{ include "user-workload.namespace" . | quote }}
        r2k_webhook_url: "http://r2k.{{ include "user-workload.namespace" . }}.svc:80/webhook"
      tasks:
        - name: Wait for RocketChat API
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/info"
            method: GET
            validate_certs: false
          register: r_rc_info
          retries: 60
          delay: 5
          until: r_rc_info.status == 200

        - name: Admin login
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/login"
            method: POST
            body_format: json
            body:
              user: "{{ '{{' }} rc_admin_user {{ '}}' }}"
              password: "{{ '{{' }} rc_admin_pass {{ '}}' }}"
            validate_certs: false
          register: r_rc_admin_login

        - name: Set admin credentials
          ansible.builtin.set_fact:
            admin_id: "{{ '{{' }} r_rc_admin_login.json.data.userId {{ '}}' }}"
            admin_token: "{{ '{{' }} r_rc_admin_login.json.data.authToken {{ '}}' }}"

        - name: Create user
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/users.create"
            method: POST
            body_format: json
            body:
              name: "{{ '{{' }} tenant_username {{ '}}' }}"
              email: "{{ '{{' }} tenant_username {{ '}}' }}@user.tld"
              username: "{{ '{{' }} tenant_username {{ '}}' }}"
              password: "{{ '{{' }} tenant_password {{ '}}' }}"
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 409]
            validate_certs: false
          register: r_rc_user

        - name: Create private channel
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/groups.create"
            method: POST
            body_format: json
            body:
              name: "{{ '{{' }} room_name {{ '}}' }}"
              members: ["{{ '{{' }} tenant_username {{ '}}' }}"]
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 400]
            validate_certs: false
          register: r_rc_channel
          failed_when: r_rc_channel.status not in [200, 400]

        - name: List existing webhooks
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/integrations.list"
            method: GET
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            validate_certs: false
          register: r_webhooks

        - name: Check if room webhook exists
          ansible.builtin.set_fact:
            room_webhook_exists: "{{ '{{' }} r_webhooks.json.integrations | selectattr('name', 'equalto', room_name ~ ' webhook') | list | length > 0 {{ '}}' }}"

        - name: Create room outgoing webhook
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/integrations.create"
            method: POST
            body_format: json
            body:
              type: webhook-outgoing
              name: "{{ '{{' }} room_name {{ '}}' }} webhook"
              event: sendMessage
              enabled: true
              channel: "#{{ '{{' }} room_name {{ '}}' }}"
              username: "{{ '{{' }} tenant_username {{ '}}' }}"
              urls: ["{{ '{{' }} r2k_webhook_url {{ '}}' }}"]
              scriptEnabled: true
              script: "class Script {process_outgoing_response({ request, response }){return false;}}"
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200]
            validate_certs: false
          when: not room_webhook_exists
          ignore_errors: true

        - name: Create AI Bot user
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/users.create"
            method: POST
            body_format: json
            body:
              name: "AI Bot"
              email: "ai-bot@bot.tld"
              username: "ai-bot"
              password: "ai-bot"
              roles: ["bot"]
              verified: true
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 409]
            validate_certs: false
          ignore_errors: true

        - name: Create AI Support channel
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/groups.create"
            method: POST
            body_format: json
            body:
              name: "{{ '{{' }} ai_channel {{ '}}' }}"
              members: ["{{ '{{' }} tenant_username {{ '}}' }}", "ai-bot"]
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 400]
            validate_certs: false
          ignore_errors: true

        - name: Discover workspace service
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Service
            namespace: "{{ '{{' }} user_namespace {{ '}}' }}"
          register: r_services
          retries: 30
          delay: 5
          until: r_services.resources | selectattr('metadata.name', 'match', '^workspace') | list | length > 0
          ignore_errors: true

        - name: Set workspace service URL
          ansible.builtin.set_fact:
            workspace_url: "http://{{ '{{' }} (r_services.resources | selectattr('metadata.name', 'match', '^workspace') | first).metadata.name {{ '}}' }}.{{ '{{' }} user_namespace {{ '}}' }}.svc.cluster.local:8080/ai-support"
          when: r_services.resources | selectattr('metadata.name', 'match', '^workspace') | list | length > 0

        - name: Check if AI webhook exists
          ansible.builtin.set_fact:
            ai_webhook_exists: "{{ '{{' }} r_webhooks.json.integrations | selectattr('name', 'equalto', ai_channel ~ ' webhook') | list | length > 0 {{ '}}' }}"

        - name: Create AI Support webhook
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/integrations.create"
            method: POST
            body_format: json
            body:
              type: webhook-outgoing
              name: "{{ '{{' }} ai_channel {{ '}}' }} webhook"
              event: sendMessage
              enabled: true
              channel: "#{{ '{{' }} ai_channel {{ '}}' }}"
              username: "ai-bot"
              urls: ["{{ '{{' }} workspace_url {{ '}}' }}"]
              scriptEnabled: true
              script: "class Script {prepare_outgoing_request({request}){if(request.data.bot){return;}return request;}}"
            headers:
              X-User-Id: "{{ '{{' }} admin_id {{ '}}' }}"
              X-Auth-Token: "{{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200]
            validate_certs: false
          when:
            - workspace_url is defined
            - not ai_webhook_exists
          ignore_errors: true

        - name: User login to get credentials
          ansible.builtin.uri:
            url: "{{ '{{' }} rc_url {{ '}}' }}/api/v1/login"
            method: POST
            body_format: json
            body:
              user: "{{ '{{' }} tenant_username {{ '}}' }}"
              password: "{{ '{{' }} tenant_password {{ '}}' }}"
            validate_certs: false
          register: r_rc_user_login

        - name: Write credentials to Vault
          kubernetes.core.k8s_exec:
            namespace: "{{ '{{' }} vault_namespace {{ '}}' }}"
            pod: "{{ '{{' }} vault_pod {{ '}}' }}"
            command: >
              vault kv put kv/secrets/tenants/{{ '{{' }} tenant_username {{ '}}' }}/rocketchat
              userId="{{ '{{' }} r_rc_user_login.json.data.userId {{ '}}' }}"
              token="{{ '{{' }} r_rc_user_login.json.data.authToken {{ '}}' }}"
              channel="{{ '{{' }} room_name {{ '}}' }}"
