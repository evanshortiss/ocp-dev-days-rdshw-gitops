apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "user-workload.name" . }}-provision
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Vault access - for writing credentials via kubectl exec
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]

  # Service discovery for RocketChat AI webhook
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "user-workload.name" . }}-provision
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "user-workload.name" . }}-provision
subjects:
  - kind: ServiceAccount
    name: {{ include "user-workload.name" . }}-provision
    namespace: {{ .Release.Namespace }}
