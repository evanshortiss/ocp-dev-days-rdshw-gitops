apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "user-workload.name" . }}-provision
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Vault access - for writing credentials
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Secrets - for reading admin credentials and NooBaa
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # Services - for service discovery
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  # Routes - for discovering endpoints
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]

  # Kafka topics - for Kafka operations
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkatopics"]
    verbs: ["get", "list", "create", "update", "patch"]

  # HTTPRoute - for Kuadrant (but we'll template instead of patch)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "user-workload.name" . }}-provision
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "user-workload.name" . }}-provision
subjects:
  - kind: ServiceAccount
    name: {{ include "user-workload.name" . }}-provision
    namespace: {{ .Release.Namespace }}
