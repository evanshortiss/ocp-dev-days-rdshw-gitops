kind: ConfigMap
metadata:
  name: {{ include "user-workload.name" . }}-matrix-provision
  annotations:
    argocd.argoproj.io/sync-wave: "0"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Matrix provisioning for {{ .Values.tenant.username }}
      hosts: localhost
      gather_facts: false
      vars:
        tenant_username: {{ .Values.tenant.username }}
        tenant_password: {{ .Values.tenant.password }}
        vault_namespace: {{ .Values.vault.namespace }}
        vault_pod: {{ .Values.vault.name }}-0
        synapse_url: "http://synapse.{{ .Values.matrix.namespace }}.svc.cluster.local:8008"
        server_name: {{ .Values.matrix.serverName | quote }}
        admin_user: {{ .Values.matrix.admin.username | quote }}
        admin_pass: {{ .Values.matrix.admin.password | quote }}
        room_name: {{ include "user-workload.roomname" . | quote }}
      tasks:
        - name: Wait for Synapse API
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/versions"
            method: GET
            validate_certs: false
          register: r_synapse
          retries: 60
          delay: 5
          until: r_synapse.status == 200

        - name: Admin login
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/r0/login"
            method: POST
            body_format: json
            body:
              type: m.login.password
              user: "{{ '{{' }} admin_user {{ '}}' }}"
              password: "{{ '{{' }} admin_pass {{ '}}' }}"
            validate_certs: false
          register: r_admin_login

        - name: Set admin token
          ansible.builtin.set_fact:
            admin_token: "{{ '{{' }} r_admin_login.json.access_token {{ '}}' }}"

        - name: Create user via Admin API
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_synapse/admin/v2/users/@{{ '{{' }} tenant_username {{ '}}' }}:{{ '{{' }} server_name {{ '}}' }}"
            method: PUT
            body_format: json
            body:
              password: "{{ '{{' }} tenant_password {{ '}}' }}"
              admin: false
              deactivated: false
            headers:
              Authorization: "Bearer {{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 201]
            validate_certs: false

        - name: Create private room
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/v3/createRoom"
            method: POST
            body_format: json
            body:
              creation_content:
                m.federate: false
              name: "{{ '{{' }} room_name {{ '}}' }}"
              preset: private_chat
              room_alias_name: "{{ '{{' }} room_name {{ '}}' }}"
              invite: ["@{{ '{{' }} tenant_username {{ '}}' }}:{{ '{{' }} server_name {{ '}}' }}"]
            headers:
              Authorization: "Bearer {{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 400]
            validate_certs: false
          register: r_room
          failed_when: false

        - name: Look up room ID if creation failed
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/v3/directory/room/%23{{ '{{' }} room_name {{ '}}' }}:{{ '{{' }} server_name {{ '}}' }}"
            method: GET
            headers:
              Authorization: "Bearer {{ '{{' }} admin_token {{ '}}' }}"
            validate_certs: false
          register: r_room_lookup
          when: r_room.status != 200

        - name: Set room ID
          ansible.builtin.set_fact:
            room_id: "{{ '{{' }} r_room.json.room_id if r_room.status == 200 else r_room_lookup.json.room_id {{ '}}' }}"

        - name: User login to get token
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/r0/login"
            method: POST
            body_format: json
            body:
              type: m.login.password
              user: "{{ '{{' }} tenant_username {{ '}}' }}"
              password: "{{ '{{' }} tenant_password {{ '}}' }}"
            validate_certs: false
          register: r_user_login

        - name: Write credentials to Vault
          kubernetes.core.k8s_exec:
            namespace: "{{ '{{' }} vault_namespace {{ '}}' }}"
            pod: "{{ '{{' }} vault_pod {{ '}}' }}"
            command: >
              vault kv put kv/secrets/tenants/{{ '{{' }} tenant_username {{ '}}' }}/matrix
              token="{{ '{{' }} r_user_login.json.access_token {{ '}}' }}"
              room="{{ '{{' }} room_id {{ '}}' }}"
