apiVersion: batch/v1
kind: Job
metadata:
  name: kuadrant-provision-{{ .Values.tenant.username }}
  # No namespace - inherits .Release.Namespace
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: {{ include "user-workload.name" . }}-provision
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kuadrant-provision
          image: registry.redhat.io/openshift4/ose-tools-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: USERNAME
              value: {{ .Values.tenant.username | quote }}
            - name: KUADRANT_NS
              value: {{ .Values.connectivityLink.kuadrantNamespace | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # --- Step 1: Generate API keys ---
              echo "Generating Kuadrant API keys for ${USERNAME}..."
              SILVER_API_KEY="silver-${USERNAME}-$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)"
              GOLD_API_KEY="gold-${USERNAME}-$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1)"
              echo "  Silver: ${SILVER_API_KEY:0:25}..."
              echo "  Gold: ${GOLD_API_KEY:0:25}..."

              # --- Step 2: Write API keys to Vault ---
              echo "Writing Kuadrant credentials to Vault..."
              VAULT_NAMESPACE="{{ .Values.vault.namespace }}"
              VAULT_POD="{{ .Values.vault.name }}-0"

              kubectl exec -n "${VAULT_NAMESPACE}" "${VAULT_POD}" -- \
                vault kv put kv/secrets/tenants/${USERNAME}/kuadrant \
                  silver_api_key="${SILVER_API_KEY}" \
                  gold_api_key="${GOLD_API_KEY}"

              echo "Kuadrant provisioning complete for ${USERNAME}."
