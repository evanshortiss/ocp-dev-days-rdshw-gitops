apiVersion: batch/v1
kind: Job
metadata:
  name: s3-provision-{{ .Values.tenant.username }}
  # No namespace - inherits .Release.Namespace
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: {{ include "user-workload.name" . }}-provision
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3-provision
          image: amazon/aws-cli:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vault-s3
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-s3
                  key: secretKey
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: vault-s3
                  key: endpoint
          command:
            - /bin/sh
            - -c
            - |
              set -e

              BUCKET="{{ .Values.tenant.username }}"
              INVOICE_URL="{{ .Values.s3.invoiceUrl }}"
              INVOICE_FILE="{{ .Values.s3.invoiceFile }}"

              echo "=== S3 provisioning for ${BUCKET} ==="

              # Step 1: Create bucket (idempotent)
              echo "Creating bucket '${BUCKET}'..."
              if aws --endpoint-url "$S3_ENDPOINT" --no-verify-ssl s3 mb "s3://${BUCKET}" 2>&1; then
                echo "Bucket created."
              else
                echo "Bucket may already exist (OK)."
              fi

              # Step 2: Download seed invoice
              echo "Downloading invoice from ${INVOICE_URL}..."
              curl -sSL -o "/tmp/${INVOICE_FILE}" "${INVOICE_URL}"
              echo "Downloaded $(wc -c < /tmp/${INVOICE_FILE}) bytes."

              # Step 3: Upload invoice to bucket
              echo "Uploading ${INVOICE_FILE} to s3://${BUCKET}/..."
              aws --endpoint-url "$S3_ENDPOINT" --no-verify-ssl \
                s3 cp "/tmp/${INVOICE_FILE}" "s3://${BUCKET}/${INVOICE_FILE}" 2>&1


              # S3 credentials already in Vault from vault-seed-s3-job
              # No need to write anything

              echo "S3 provisioning complete for ${BUCKET}."
