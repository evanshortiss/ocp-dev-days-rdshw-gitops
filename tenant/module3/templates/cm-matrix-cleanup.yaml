kind: ConfigMap
metadata:
  name: {{ include "user-workload.name" . }}-matrix-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Matrix cleanup for {{ .Values.tenant.username }}
      hosts: localhost
      gather_facts: false
      vars:
        tenant_username: {{ .Values.tenant.username }}
        synapse_url: "http://synapse.{{ .Values.matrix.namespace }}.svc.cluster.local:8008"
        server_name: {{ .Values.matrix.serverName | quote }}
        admin_user: {{ .Values.matrix.admin.username | quote }}
        admin_pass: {{ .Values.matrix.admin.password | quote }}
        room_name: {{ include "user-workload.roomname" . | quote }}
      tasks:
        - name: Admin login
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/r0/login"
            method: POST
            body_format: json
            body:
              type: m.login.password
              user: "{{ '{{' }} admin_user {{ '}}' }}"
              password: "{{ '{{' }} admin_pass {{ '}}' }}"
            validate_certs: false
          register: r_admin_login
          ignore_errors: true

        - name: Set admin token
          ansible.builtin.set_fact:
            admin_token: "{{ '{{' }} r_admin_login.json.access_token {{ '}}' }}"
          when: r_admin_login is success

        - name: Resolve room alias to room_id
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_matrix/client/v3/directory/room/%23{{ '{{' }} room_name {{ '}}' }}:{{ '{{' }} server_name {{ '}}' }}"
            method: GET
            headers:
              Authorization: "Bearer {{ '{{' }} admin_token {{ '}}' }}"
            status_code: [200, 404]
            validate_certs: false
          register: r_room
          when: r_admin_login is success
          ignore_errors: true

        - name: Delete room
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_synapse/admin/v1/rooms/{{ '{{' }} r_room.json.room_id {{ '}}' }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ '{{' }} admin_token {{ '}}' }}"
            body_format: json
            body:
              purge: true
            status_code: [200, 404]
            validate_certs: false
          when:
            - r_admin_login is success
            - r_room is success
            - r_room.status == 200
          ignore_errors: true

        - name: Deactivate user
          ansible.builtin.uri:
            url: "{{ '{{' }} synapse_url {{ '}}' }}/_synapse/admin/v1/deactivate/@{{ '{{' }} tenant_username {{ '}}' }}:{{ '{{' }} server_name {{ '}}' }}"
            method: POST
            headers:
              Authorization: "Bearer {{ '{{' }} admin_token {{ '}}' }}"
            body_format: json
            body:
              erase: true
            status_code: [200, 404]
            validate_certs: false
          when: r_admin_login is success
          ignore_errors: true
