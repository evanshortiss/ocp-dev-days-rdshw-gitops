kind: ConfigMap
metadata:
  name: {{ include "user-workload.name" . }}-helpdesk-provision
  annotations:
    argocd.argoproj.io/sync-wave: "0"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Helpdesk provisioning for {{ .Values.tenant.username }}
      hosts: localhost
      gather_facts: false
      vars:
        tenant_username: {{ .Values.tenant.username }}
        tenant_password: {{ .Values.tenant.password }}
        vault_namespace: {{ .Values.vault.namespace }}
        vault_pod: {{ .Values.vault.name }}-0
        hd_url: "http://helpdesk.{{ .Values.helpdesk.namespace }}.svc.cluster.local:8118"
        admin_user: {{ .Values.helpdesk.admin.username | quote }}
        admin_pass: {{ .Values.helpdesk.admin.password | quote }}
        group_name: "Group {{ .Values.tenant.username }}"
      tasks:
        - name: Wait for Trudesk API
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}"
            method: GET
            validate_certs: false
          register: r_hd
          retries: 60
          delay: 5
          until: r_hd.status == 200

        - name: Admin login
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/login"
            method: POST
            body_format: json
            body:
              username: "{{ '{{' }} admin_user {{ '}}' }}"
              password: "{{ '{{' }} admin_pass {{ '}}' }}"
            validate_certs: false
          register: r_admin_login

        - name: Set admin token
          ansible.builtin.set_fact:
            access_token: "{{ '{{' }} r_admin_login.json.accessToken {{ '}}' }}"

        - name: Get User role ID
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/roles"
            method: GET
            headers:
              accesstoken: "{{ '{{' }} access_token {{ '}}' }}"
            validate_certs: false
          register: r_roles

        - name: Set role ID
          ansible.builtin.set_fact:
            role_id: "{{ '{{' }} (r_roles.json.roles | selectattr('name', 'equalto', 'User') | first)._id {{ '}}' }}"

        - name: Create group
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/groups/create"
            method: POST
            body_format: json
            body:
              name: "{{ '{{' }} group_name {{ '}}' }}"
              members: []
            headers:
              accesstoken: "{{ '{{' }} access_token {{ '}}' }}"
            status_code: [200, 400]
            validate_certs: false
          register: r_group
          failed_when: false

        - name: Get group ID
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/groups"
            method: GET
            headers:
              accesstoken: "{{ '{{' }} access_token {{ '}}' }}"
            validate_certs: false
          register: r_groups

        - name: Set group ID
          ansible.builtin.set_fact:
            group_id: "{{ '{{' }} (r_groups.json.groups | selectattr('name', 'equalto', group_name) | first)._id {{ '}}' }}"

        - name: Create user
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/users/create"
            method: POST
            body_format: json
            body:
              username: "{{ '{{' }} tenant_username {{ '}}' }}"
              password: "{{ '{{' }} tenant_password {{ '}}' }}"
              fullname: "{{ '{{' }} tenant_username {{ '}}' }}"
              email: "{{ '{{' }} tenant_username {{ '}}' }}@user.tld"
              role: "{{ '{{' }} role_id {{ '}}' }}"
              groups: ["{{ '{{' }} group_id {{ '}}' }}"]
            headers:
              accesstoken: "{{ '{{' }} access_token {{ '}}' }}"
            status_code: [200, 400]
            validate_certs: false
          failed_when: false

        - name: Get ticket type and priority IDs
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/tickets/types"
            method: GET
            headers:
              accesstoken: "{{ '{{' }} access_token {{ '}}' }}"
            validate_certs: false
          register: r_types

        - name: Get priorities
          ansible.builtin.uri:
            url: "{{ '{{' }} hd_url {{ '}}' }}/api/v1/tickets/priorities"
            method: GET
            headers:
              accesstoken: "{{ '{{' }} access_token {{ '}}' }}"
            validate_certs: false
          register: r_priorities

        - name: Set type and priority IDs
          ansible.builtin.set_fact:
            type_id_issue: "{{ '{{' }} (r_types.json.types | selectattr('name', 'equalto', 'Issue') | first)._id {{ '}}' }}"
            priority_id_normal: "{{ '{{' }} (r_priorities.json.priorities | selectattr('name', 'equalto', 'Normal') | first)._id {{ '}}' }}"

        - name: Write credentials to Vault
          kubernetes.core.k8s_exec:
            namespace: "{{ '{{' }} vault_namespace {{ '}}' }}"
            pod: "{{ '{{' }} vault_pod {{ '}}' }}"
            command: >
              vault kv put kv/secrets/tenants/{{ '{{' }} tenant_username {{ '}}' }}/helpdesk
              username="{{ '{{' }} tenant_username {{ '}}' }}"
              password="{{ '{{' }} tenant_password {{ '}}' }}"
              groupId="{{ '{{' }} group_id {{ '}}' }}"
              typeIdIssue="{{ '{{' }} type_id_issue {{ '}}' }}"
              priorityIdNormal="{{ '{{' }} priority_id_normal {{ '}}' }}"
